<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Cart Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">ShopCart</div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Shop</a>
            <a href="#">Cart</a>
            <span class="cart-icon">🛒</span>
        </nav>
    </header>

    <div class="container">
        <div class="cart-items" id="cart-items">
            <h2>Your Cart</h2>
            <!-- Items will be dynamically added here -->
        </div>
        <div class="cart-totals" id="cart-totals">
            <h3>Cart Totals</h3>
            <p><span>Subtotal:</span> <span id="subtotal">₹0.00</span></p>
            <p><span>Total:</span> <span id="total">₹0.00</span></p>
            <a href="#" class="checkout-button">Check Out</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
